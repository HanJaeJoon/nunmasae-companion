name: 틀린 사실 / Wrong fact
description: 항목의 사실 문장이 틀렸어요 / A fact in an entry is wrong
title: "[사실 / Fact] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **스포일러 주의**: 이슈 제목과 본문에 아직 안 읽은 사람에게 스포일러가 될 내용을 쓸 때는 첫 줄에 `[스포일러 N권]`을 적어 주세요.
        **Spoiler warning**: if your title or text would spoil something for readers who have not finished, put `[Spoiler Book N]` on the first line.

        원문을 그대로 옮겨 적지 말고 요약해 주세요. / Please summarize instead of quoting the book.
  - type: input
    id: entry
    attributes:
      label: 항목 이름 / Entry name
      placeholder: 케이건 드라카 / Kagan Draca
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 지금 문장 / Current sentence
      description: 앱에 보이는 문장 / The sentence as shown in the app
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: 고칠 내용 / What it should say
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거 / Evidence
      description: 권/장/쪽과 출처 / Book, chapter, page and source
  - type: dropdown
    id: progress
    attributes:
      label: 읽은 지점 / Read-through setting
      description: 이 문장을 볼 때 앱에서 고른 권 / The book selected in the app when you saw it
      options:
        - 1권까지 / Through Book 1
        - 2권까지 / Through Book 2
        - 3권까지 / Through Book 3
        - 4권까지 / Through Book 4
